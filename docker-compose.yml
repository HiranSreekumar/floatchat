# One-command local dev environment: Postgres + FastAPI backend.
# The React frontend is run separately with `npm run dev` (see README) since
# you'll want its instant hot-reload while building the UI.
#
# Usage:
#   cp backend/.env.example backend/.env   # then fill in ANTHROPIC_API_KEY
#   docker compose up --build
version: "3.9"
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: floatchat
      POSTGRES_PASSWORD: floatchat
      POSTGRES_DB: floatchat
    ports:
      - "5432:5432"
    volumes:
      - floatchat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U floatchat"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://floatchat:floatchat@db:5432/floatchat
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  floatchat_pgdata:
